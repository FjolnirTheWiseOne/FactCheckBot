services:
  - type: web
    name: factcheckbot-web
    env: python
    branch: dev
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

  - type: worker
    name: factcheckbot-bot
    env: python
    branch: dev
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -u backend/bot.py
    # Note: secrets (TELEGRAM_TOKEN) should be set in Render dashboard, not stored here
    envVars:
      - key: API_URL
        value: https://factcheckbot.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
